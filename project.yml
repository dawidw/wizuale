name: Wizuale
options:
  bundleIdPrefix: app.wizuale
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "3"
    TVOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: appletvos
    SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    ENABLE_BITCODE: NO
    MTL_FAST_MATH: YES
  configs:
    Debug:
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Wizuale:
    type: application
    platform: tvOS
    sources:
      - path: Wizuale
        excludes:
          - Info.plist
          - Wizuale.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wizuale.Wizuale
        PRODUCT_NAME: Wizuale
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Wizuale/Info.plist
        CODE_SIGN_ENTITLEMENTS: Wizuale/Wizuale.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "3"
        TVOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: 59Z33S5F96
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    scheme:
      gatherCoverageData: false
  WizualeMic:
    type: application
    platform: iOS
    sources:
      - path: WizualeMic
        excludes:
          - Info.plist
          - WizualeMic.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wizuale.Wizuale.mic
        PRODUCT_NAME: "Wizuale Mic"
        INFOPLIST_KEY_CFBundleDisplayName: "Wizuale Mic"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WizualeMic/Info.plist
        CODE_SIGN_ENTITLEMENTS: WizualeMic/WizualeMic.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: 59Z33S5F96
    scheme:
      gatherCoverageData: false
